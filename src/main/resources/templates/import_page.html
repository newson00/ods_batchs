<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Import Tables</title>
    <link rel="stylesheet" th:href="@{/css/common_menu.css}" />
    <link rel="stylesheet" th:href="@{/css/common_batches.css}" />
    <link rel="stylesheet" th:href="@{/css/common_import.css}" />
    <script>
        function uploadFile() {
            const formData = new FormData();
            formData.append("file", document.getElementById("file").files[0]);

            fetch('/api/import/upload', {
                method: 'POST',
                body: formData
            }).then(response => response.text())
                .then(data => {
                    alert(data);
                    location.reload();
                }).catch(error => {
                alert('Failed to upload file');
            });
        }

        function showColumns(tableId) {
            fetch(`/api/import/tables/${tableId}`)
                .then(response => response.json())
                .then(data => {
                    let modalBody = document.getElementById("modalBody");
                    modalBody.innerHTML = ''; // Clear previous content

                    // Create a table for columns
                    const columnsTable = document.createElement("table");
                    columnsTable.className = "columns-table"; // Add class for styling

                    // Create table header
                    const headerRow = document.createElement("tr");
                    headerRow.innerHTML = `
                        <th>Column</th>
                        <th>Type</th>
                        <th>Length</th>
                    `;
                    columnsTable.appendChild(headerRow);

                    // Populate the table with column data
                    data.forEach(column => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${column.columnName}</td>
                            <td>${column.columnType}</td>
                            <td>${column.columnLength}</td>
                        `;
                        columnsTable.appendChild(row);
                    });

                    modalBody.appendChild(columnsTable);
                    document.getElementById("columnsModal").style.display = "block";
                });
        }

        function editTable(tableId) {
            window.location.href = '/edit-table/' + tableId;
        }

        function deleteTable(tableId) {
            if (confirm("Are you sure you want to delete this table?")) {
                fetch('/api/import/tables/' + tableId, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        alert('Table deleted successfully');
                        location.reload();  // Reload the page to reflect the changes
                    } else {
                        alert('Failed to delete table');
                    }
                }).catch(error => {
                    alert('Error: ' + error);
                });
            }
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById("columnsModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    </script>
</head>
<body>

<!-- Left sidebar -->
<div class="sidebar">
    <h2>Menu</h2>
    <ul>
        <li><a th:href="@{/url-batches}">Go to URL Batches</a></li>
        <li><a th:href="@{/import/page}">Go to Import Page</a></li>
    </ul>
</div>

<!-- Right content area -->
<div class="content">
    <h1>Import Table Data</h1>

    <div>
        <input type="file" id="file"/>
        <button onclick="uploadFile()">Upload</button>
    </div>

    <h2>Imported Tables</h2>
    <table>
        <thead>
        <tr>
            <th>Table Name</th>
            <th>Import Time</th>
            <th>Update Time</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Render imported table data with Thymeleaf -->
        <tr th:each="table : ${tables}">
            <td th:text="${table.tableName}"></td>
            <td th:text="${table.importTime}"></td>
            <td th:text="${table.updateTime}"></td>
            <td>
                <button th:onclick="'showColumns(' + ${table.id} + ')'">View Columns</button>
                <button th:onclick="'editTable(' + ${table.id} + ')'">Edit</button>
                <button th:onclick="'deleteTable(' + ${table.id} + ')'">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Modal for viewing columns -->
    <div id="columnsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('columnsModal').style.display='none'">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>
</div>

</body>
</html>
